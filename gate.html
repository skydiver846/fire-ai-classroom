<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>접속 코드 · AI 강의실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f5f7;--paper:#fff;--ink:#1b2230;--muted:#5b6474;--line:#dde1e8;--accent:#c8321e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11151b;--paper:#181d25;--ink:#e6e9ee;--muted:#9aa3b2;--line:#2a313d;--accent:#ff6a52}}
:root[data-theme="dark"]{--bg:#11151b;--paper:#181d25;--ink:#e6e9ee;--muted:#9aa3b2;--line:#2a313d;--accent:#ff6a52}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.7 "IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;word-break:keep-all}
form{width:100%;max-width:440px;padding:28px 26px;border-radius:16px;background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--accent);box-shadow:0 10px 30px rgba(16,24,40,.12)}
.k{margin:0;font:700 12px monospace;color:var(--accent);letter-spacing:.06em}
h1{margin:4px 0 10px;font:400 24px/1.3 "Black Han Sans","IBM Plex Sans KR",sans-serif}
label{display:block;margin-top:14px;font-weight:700;font-size:14px}
.row{display:flex;gap:8px;margin-top:6px}
input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:700 15px inherit;padding:9px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.msg{min-height:1.4em;margin:8px 0 0;color:var(--accent);font-size:14px}
.note{margin:12px 0 0;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<form id="f">
  <p class="k">AI 강의실</p>
  <h1>강의 전 비공개 자료</h1>
  <p>강사에게 받은 <b>접속 코드</b>를 넣어 주세요.</p>
  <label for="c">접속 코드</label>
  <div class="row"><input id="c" type="password" autocomplete="off" required><button type="submit">들어가기</button></div>
  <p class="msg" id="m" role="status"></p>
  <p class="note">한 번 넣으면 이 브라우저에서는 기억합니다.</p>
</form>
<script>
  (function () {
    var p = new URLSearchParams(location.search).get('next') || '/';
    var next = /^\/[^/\\]/.test(p) || p === '/' ? p : '/';   // 이 사이트 안 주소로만 돌아감
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var m = document.getElementById('m'); m.textContent = '확인하는 중…';
      fetch('/api/unlock', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: document.getElementById('c').value.trim() }) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.error || '확인하지 못했습니다.'); location.replace(next); }); })
        .catch(function (err) { m.textContent = err.message; });
    });
  })();
</script>
</body>
</html>
