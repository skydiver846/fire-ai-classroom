<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>소방학교 AI 강의실</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
  <style>
    /* 강의 목록 첫 화면: 좁은 단일 컬럼, 강의마다 카드 한 장 */
    :root {
      --bg: #f4f5f7; --paper: #ffffff; --ink: #1b2230; --muted: #5b6474; --line: #dde1e8;
      --accent: #c8321e; --accent-soft: #fbe9e6;
      --font-display: "Black Han Sans", "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
      --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #11151b; --paper: #181d25; --ink: #e6e9ee; --muted: #9aa3b2; --line: #2a313d;
        --accent: #ff6a52; --accent-soft: #3a2220; color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #11151b; --paper: #181d25; --ink: #e6e9ee; --muted: #9aa3b2; --line: #2a313d;
      --accent: #ff6a52; --accent-soft: #3a2220; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 var(--font-body); }
    .wrap { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; display: grid; gap: 28px; }
    .eyebrow { color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: .06em; }
    h1 { margin: 4px 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 38px; line-height: 1.15; }
    header p { margin: 0; color: var(--muted); }
    .courses { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
    .course a {
      display: grid; gap: 6px; padding: 20px 22px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--paper); color: inherit; text-decoration: none;
    }
    .course a:hover { border-color: var(--accent); }
    .course a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .course h2 { margin: 0; font-size: 20px; }
    .course p { margin: 0; color: var(--muted); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .tags span { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    footer { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">소방학교 교육운영</span>
      <h1>AI 강의실</h1>
      <p>수업에서 쓰는 강의자료입니다. 강사가 안내한 강의를 눌러 들어가세요.</p>
    </header>

    <ul class="courses">
      <li class="course">
        <a href="fire-ai/">
          <h2>생성형 AI 업무 활용 입문</h2>
          <p>계정 만들기부터 프롬프트, 옵시디언, 스킬, PRD를 거쳐 강의평가 결과보고를 자동화하는 화면을 만들고 웹에 공개하기까지</p>
          <div class="tags"><span>3일 과정 · 하루 4시간</span><span>12모듈</span><span>실습: 과정별 강의평가 결과보고</span></div>
        </a>
      </li>
    </ul>

    <footer>실습에는 실제 개인정보·내부 문서를 넣지 않습니다.</footer>
  </div>
</body>
</html>
