<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>구내식당 메뉴 만족도 - 1단계 HTML</title>
</head>
<body>
  <!--
    1단계: HTML = 뼈대
    화면에 "무엇이" 있는지만 적습니다. 모양(색, 크기)과 동작은 아직 없습니다.
    <태그>내용</태그> 처럼 여는 태그와 닫는 태그 사이에 내용을 넣습니다.
  -->

  <h1>구내식당 메뉴 만족도</h1>
  <p>10월 2주차 (10. 12.~10. 16.) · 평균 3.5 미만은 개선 필요</p>

  <form>
    <label for="menu">메뉴</label>
    <input id="menu" placeholder="예: 김치찌개">

    <label for="meal">식사</label>
    <select id="meal">
      <option value="">선택</option>
      <option value="점심">점심</option>
      <option value="저녁">저녁</option>
    </select>

    <label for="score">만족도</label>
    <select id="score">
      <option value="">선택</option>
      <option value="5">5 매우 만족</option>
      <option value="4">4 만족</option>
      <option value="3">3 보통</option>
      <option value="2">2 불만족</option>
      <option value="1">1 매우 불만족</option>
    </select>

    <button type="submit">평가 제출</button>
  </form>

  <h2>메뉴·식사별 결과</h2>
  <table>
    <tr><th>메뉴</th><th>식사</th><th>응답</th><th>평균</th><th>상태</th></tr>
    <tr><td>김치찌개</td><td>점심</td><td>3</td><td>4.7</td><td>양호</td></tr>
    <tr><td>김치찌개</td><td>저녁</td><td>3</td><td>3.3</td><td>개선 필요</td></tr>
    <tr><td>제육볶음</td><td>점심</td><td>2</td><td>4.5</td><td>양호</td></tr>
  </table>
</body>
</html>
