<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강의평가 결과 집계 - 2단계 CSS</title>

  <!--
    2단계: CSS = 옷과 인테리어
    HTML은 1단계와 거의 같습니다. <style> 안에 "어떤 것을 어떻게 보이게 할지"만 더했습니다.
    규칙 모양: 대상 { 속성: 값; }
  -->
  <style>
    /* 페이지 전체: 배경색, 글자 */
    body {
      margin: 0;
      background: #f3f4f6;
      color: #1b2230;
      font-family: system-ui, "Apple SD Gothic Neo", sans-serif;
      line-height: 1.6;
    }

    /* 가운데 정렬된 좁은 기둥: 휴대폰에서도 보기 좋게 */
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 { margin: 0; font-size: 32px; }
    .sub { margin: 4px 0 24px; color: #5d6676; }

    /* 입력 영역: 칸과 버튼을 한 줄에, 좁으면 다음 줄로 */
    form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    .field { display: grid; gap: 4px; flex: 1 1 140px; }
    label { font-size: 13px; font-weight: 600; }
    input, select {
      padding: 10px 12px;
      border: 1px solid #dde1e8;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    /* 제출 버튼: 소방 적색 */
    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #c8321e;
      color: white;
      font-size: 15px;
      font-weight: 600;
    }

    /* 결과표: 줄마다 구분선, 숫자는 오른쪽 정렬 */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 4px; border-bottom: 1px solid #dde1e8; text-align: left; }
    th { font-size: 12px; color: #5d6676; }
    .num { text-align: right; }

    /* 양호/개선 필요 표시: 색으로 구분 */
    .ok  { color: #1f7a4d; font-weight: 600; }
    .bad { color: #c8321e; font-weight: 600; }
    .error { flex-basis: 100%; margin: 0; color: #c8321e; font-size: 13px; min-height: 1.6em; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>강의평가 결과 집계</h1>
    <p class="sub">신임소방관 교육과정 · 평균 3.5 미만은 개선 필요</p>

    <form>
      <div class="field">
        <label for="subject">과목</label>
        <input id="subject" placeholder="예: 화재진압 전술">
      </div>
      <div class="field">
        <label for="instructor">교관</label>
        <input id="instructor" placeholder="예: 김교관">
      </div>
      <div class="field">
        <label for="score">만족도</label>
        <select id="score">
          <option value="">선택</option>
          <option value="5">5 매우 만족</option>
          <option value="4">4 만족</option>
          <option value="3">3 보통</option>
          <option value="2">2 불만족</option>
          <option value="1">1 매우 불만족</option>
        </select>
      </div>
      <button type="submit">평가 제출</button>
    </form>

    <h2>과목·교관별 결과</h2>
    <table>
      <thead>
        <tr><th>과목</th><th>교관</th><th class="num">응답</th><th class="num">평균</th><th class="num">상태</th></tr>
      </thead>
      <tbody>
        <tr><td>화재진압 전술</td><td>김교관</td><td class="num">3</td><td class="num">4.7</td><td class="num ok">양호</td></tr>
        <tr><td>화재진압 전술</td><td>이교관</td><td class="num">3</td><td class="num">3.3</td><td class="num bad">개선 필요</td></tr>
        <tr><td>응급처치 실습</td><td>박교관</td><td class="num">2</td><td class="num">4.5</td><td class="num ok">양호</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
