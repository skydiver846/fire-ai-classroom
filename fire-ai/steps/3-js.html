<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강의평가 결과 집계 - 3단계 JavaScript</title>

  <!--
    3단계: JavaScript = 움직이는 근육
    HTML과 CSS는 2단계와 같습니다. 맨 아래 <script> 안에 "버튼을 누르면 무엇을 할지"를 더했습니다.
    이제 결과표는 미리 적어 둔 글이 아니라, 평가를 낼 때마다 새로 계산됩니다.
  -->
  <style>
    /* 페이지 전체: 배경색, 글자 */
    body {
      margin: 0;
      background: #f3f4f6;
      color: #1b2230;
      font-family: system-ui, "Apple SD Gothic Neo", sans-serif;
      line-height: 1.6;
    }

    /* 가운데 정렬된 좁은 기둥: 휴대폰에서도 보기 좋게 */
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 { margin: 0; font-size: 32px; }
    .sub { margin: 4px 0 24px; color: #5d6676; }

    /* 입력 영역: 칸과 버튼을 한 줄에, 좁으면 다음 줄로 */
    form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    .field { display: grid; gap: 4px; flex: 1 1 140px; }
    label { font-size: 13px; font-weight: 600; }
    input, select {
      padding: 10px 12px;
      border: 1px solid #dde1e8;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    /* 제출 버튼: 소방 적색 */
    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #c8321e;
      color: white;
      font-size: 15px;
      font-weight: 600;
    }

    /* 결과표: 줄마다 구분선, 숫자는 오른쪽 정렬 */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 4px; border-bottom: 1px solid #dde1e8; text-align: left; }
    th { font-size: 12px; color: #5d6676; }
    .num { text-align: right; }

    /* 양호/개선 필요 표시: 색으로 구분 */
    .ok  { color: #1f7a4d; font-weight: 600; }
    .bad { color: #c8321e; font-weight: 600; }
    .error { flex-basis: 100%; margin: 0; color: #c8321e; font-size: 13px; min-height: 1.6em; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>강의평가 결과 집계</h1>
    <p class="sub">신임소방관 교육과정 · 평균 3.5 미만은 개선 필요</p>

    <form id="eval-form">
      <div class="field">
        <label for="subject">과목</label>
        <input id="subject" placeholder="예: 화재진압 전술">
      </div>
      <div class="field">
        <label for="instructor">교관</label>
        <input id="instructor" placeholder="예: 김교관">
      </div>
      <div class="field">
        <label for="score">만족도</label>
        <select id="score">
          <option value="">선택</option>
          <option value="5">5 매우 만족</option>
          <option value="4">4 만족</option>
          <option value="3">3 보통</option>
          <option value="2">2 불만족</option>
          <option value="1">1 매우 불만족</option>
        </select>
      </div>
      <button type="submit">평가 제출</button>
      <p class="error" id="error"></p>
    </form>

    <h2>과목·교관별 결과 (응답 <span id="count">0</span>건)</h2>
    <table>
      <thead>
        <tr><th>과목</th><th>교관</th><th class="num">응답</th><th class="num">평균</th><th class="num">상태</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    // 1) 화면에서 필요한 부분을 id로 찾아 둔다
    const form = document.getElementById("eval-form");
    const rows = document.getElementById("rows");
    const count = document.getElementById("count");
    const error = document.getElementById("error");

    // 2) 제출된 응답을 모아 두는 상자 (배열). 새로고침하면 비워진다.
    const answers = [];

    // 3) 평균이 3.5보다 낮으면 개선 필요 (PRD의 규칙을 코드로 옮긴 부분)
    function needsImprovement(avg) {
      return avg < 3.5;
    }

    // 4) 과목 + 교관이 같은 응답끼리 묶어서 결과표를 다시 그린다
    function drawTable() {
      const groups = {};
      for (const a of answers) {
        const key = a.subject + " / " + a.instructor;
        if (!groups[key]) groups[key] = { subject: a.subject, instructor: a.instructor, count: 0, sum: 0 };
        groups[key].count += 1;
        groups[key].sum += a.score;
      }

      rows.innerHTML = "";
      for (const key in groups) {
        const g = groups[key];
        const avg = g.sum / g.count;
        const tr = document.createElement("tr");
        const cells = [g.subject, g.instructor, g.count, avg.toFixed(1),
                       needsImprovement(avg) ? "개선 필요" : "양호"];
        cells.forEach(function (text, i) {
          const td = document.createElement("td");
          td.textContent = text;
          if (i >= 2) td.className = "num";
          if (i === 4) td.className = "num " + (needsImprovement(avg) ? "bad" : "ok");
          tr.append(td);
        });
        rows.append(tr);
      }
      count.textContent = answers.length;
    }

    // 5) 평가 제출 버튼을 누르면 실행된다
    form.addEventListener("submit", function (event) {
      event.preventDefault();   // 페이지가 새로고침되지 않게 막는다

      const subject = document.getElementById("subject").value.trim();
      const instructor = document.getElementById("instructor").value.trim();
      const score = Number(document.getElementById("score").value);
      if (subject === "" || instructor === "" || score === 0) {
        error.textContent = "과목, 교관, 만족도를 모두 입력하세요.";
        return;
      }

      answers.push({ subject: subject, instructor: instructor, score: score });
      drawTable();
      error.textContent = "";
      document.getElementById("score").value = "";   // 만족도만 비우기
    });
  </script>
</body>
</html>
