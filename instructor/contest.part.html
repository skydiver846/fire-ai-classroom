<div class="contest">
<p class="c-now" id="c-status" aria-live="polite">불러오는 중…</p>

<section class="c-step" id="c-login-box">
  <form id="c-enter" class="c-form">
    <h2>시작하기</h2>
    <label for="e-name">이름</label><input id="e-name" maxlength="20" autocomplete="off" required>
    <label for="e-pin">비밀번호 (숫자 4자리)</label><input id="e-pin" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="off" required>
    <button type="submit">시작하기</button>
    <p class="hint">처음이면 이 이름과 비밀번호로 등록됩니다. 다음부터 같은 이름 · 비밀번호를 넣으면 이어집니다.</p>
    <p class="msg" id="e-msg" role="status"></p>
  </form>
</section>

<p class="c-me" id="c-me" hidden><span id="c-me-t"></span> <button type="button" class="link" id="c-out">다른 이름으로</button></p>

<section class="c-step" id="c-submit-box" hidden>
  <form id="c-submit" class="c-form wide">
    <h2>내 작품 내기</h2>
    <label for="s-title">도구 이름</label><input id="s-title" maxlength="40" placeholder="예) 교육 장비 점검표" required>
    <label for="s-url">배포 주소</label><input id="s-url" type="url" maxlength="200" placeholder="https://gear-check-hong.vercel.app" required>
    <label for="s-intro">한 줄 소개</label><input id="s-intro" maxlength="120" placeholder="나는 (무엇)을 만들어 (누가) (어디에) 쓴다." required>
    <fieldset><legend>연동한 것</legend>
      <label class="inline"><input type="radio" name="track" value="db" id="s-db"> DB</label>
      <label class="inline"><input type="radio" name="track" value="api" id="s-api"> API</label>
      <label class="inline"><input type="radio" name="track" value="both" id="s-both"> 둘 다</label>
    </fieldset>
    <button type="submit">제출하기</button>
    <p class="hint">다시 내면 고쳐집니다. 마감 16:20.</p>
    <p class="msg" id="s-msg" role="status"></p>
  </form>
</section>

<section class="c-step" id="c-result-box" hidden>
  <h2>🏆 결과</h2>
  <div class="table-wrap"><table><thead><tr><th>순위</th><th>도구 이름</th><th>만든 사람</th><th>득표</th></tr></thead><tbody id="c-results"></tbody></table></div>
  <p class="hint">1등은 가장 많은 표를 받은 작품입니다. 동점이면 교수부장님이 동점 작품 중에서 정합니다.</p>
</section>

<section class="c-step">
  <h2>모두의 작품</h2>
  <ol class="works" id="c-works"></ol>
  <div class="vote-bar" id="c-vote-bar" hidden>
    <span id="c-vote-count">0 / 3</span>
    <button type="button" id="c-vote-btn" disabled>투표하기</button>
    <span class="msg" id="v-msg" role="status"></span>
  </div>
</section>
</div>
